<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RGB-D 点云预览</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090c11; --panel: #141a24; --line: #2a3445;
      --text: #e8edf5; --muted: #93a0b4; --blue: #4d8eff; --red: #ff6b72;
      --green: #4dd69a; --orange: #ffb34d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    header {
      height: 58px; display: flex; align-items: center; justify-content: space-between;
      gap: 14px; padding: 0 18px; border-bottom: 1px solid var(--line);
      background: #0d1118;
    }
    h1 { font-size: 17px; margin: 0; }
    .muted { color: var(--muted); font-size: 12px; }
    .layout { height: calc(100vh - 58px); display: grid; grid-template-columns: 310px 1fr; }
    aside {
      padding: 15px; border-right: 1px solid var(--line); background: var(--panel);
      overflow-y: auto;
    }
    label { display: grid; gap: 5px; margin-bottom: 12px; color: var(--muted); font-size: 12px; }
    select, input {
      width: 100%; border: 1px solid var(--line); border-radius: 8px;
      background: #0d121a; color: var(--text); padding: 8px 9px;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    button {
      width: 100%; border: 1px solid #427ce0; border-radius: 8px;
      background: #2868d6; color: white; font-weight: 650; padding: 9px;
      cursor: pointer;
    }
    button:hover { background: #3274e6; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .secondary { background: #202938; border-color: var(--line); margin-top: 8px; }
    .pick-active { background: #a56812; border-color: var(--orange); }
    .check {
      display: flex; align-items: center; gap: 8px; margin: 2px 0 12px;
    }
    .check input { width: auto; }
    .status {
      margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
      color: var(--muted); overflow-wrap: anywhere;
    }
    .status strong { color: var(--text); display: block; font-size: 18px; margin-bottom: 4px; }
    .error { color: var(--red); }
    .hint { margin-top: 14px; color: var(--muted); font-size: 12px; }
    .analysis {
      margin-top: 12px; padding: 10px; border: 1px solid var(--line);
      border-radius: 8px; background: #0d121a; color: var(--muted);
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .stage { position: relative; min-width: 0; background: #040609; }
    canvas { width: 100%; height: 100%; display: block; cursor: grab; }
    .stage.rgb-open canvas { width: 54%; }
    canvas:active { cursor: grabbing; }
    .hud {
      position: absolute; left: 14px; bottom: 12px; padding: 7px 10px;
      border: 1px solid rgba(255,255,255,.12); border-radius: 7px;
      background: rgba(8,11,16,.72); color: var(--muted); pointer-events: none;
      backdrop-filter: blur(8px);
    }
    .target-marker {
      position: absolute; width: 18px; height: 18px; border: 2px solid #fff;
      border-radius: 50%; background: var(--red); box-shadow: 0 0 0 3px rgba(255,107,114,.28);
      transform: translate(-50%, -50%); pointer-events: none; display: none;
    }
    .rgb-picker {
      position: absolute; z-index: 5; top: 14px; right: 14px;
      width: calc(46% - 21px); min-width: 360px; padding: 10px;
      border: 1px solid var(--line); border-radius: 10px;
      background: rgba(13,17,24,.96); box-shadow: 0 12px 40px rgba(0,0,0,.45);
      max-height: calc(100% - 28px); overflow-y: auto;
    }
    .rgb-picker[hidden] { display: none; }
    .rgb-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 8px;
    }
    .rgb-head button { width: auto; padding: 5px 10px; margin-top: 0; }
    .rgb-image-wrap { position: relative; width: 100%; line-height: 0; }
    .rgb-image-wrap img {
      display: block; width: 100%; height: auto;
      background: #05070a; cursor: crosshair;
    }
    .rgb-overlay { position: absolute; inset: 0; pointer-events: none; }
    .rgb-box {
      position: absolute; border: 2px solid var(--green);
      color: #07130e; background: transparent;
    }
    .rgb-box span {
      position: absolute; left: -2px; top: -20px; padding: 2px 5px;
      background: var(--green); font: 11px/1.35 sans-serif; white-space: nowrap;
    }
    .rgb-dot {
      position: absolute; width: 15px; height: 15px; border-radius: 50%;
      border: 2px solid white; background: var(--red);
      box-shadow: 0 0 0 3px rgba(255,107,114,.3);
      transform: translate(-50%, -50%);
    }
    .rgb-foot { margin-top: 7px; color: var(--muted); font-size: 12px; }
    @media (max-width: 760px) {
      body { overflow: auto; }
      .layout { display: flex; flex-direction: column; height: auto; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .stage { height: 65vh; }
      .stage.rgb-open canvas { width: 100%; }
      .rgb-picker { min-width: 0; width: calc(100% - 20px); right: 10px; top: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <div><h1>已采集 RGB-D 点云</h1><div class="muted">由 color.jpg + depth_aligned.png 按需重建</div></div>
    <div id="rootPath" class="muted">连接中</div>
  </header>
  <div class="layout">
    <aside>
      <label>采集会话
        <select id="session"></select>
      </label>
      <label>帧
        <select id="frame"></select>
      </label>
      <div class="row">
        <label>采样步长
          <input id="stride" type="number" min="1" max="64" value="3">
        </label>
        <label>最大点数
          <input id="maxPoints" type="number" min="1000" max="1000000" value="200000">
        </label>
      </div>
      <div class="row">
        <label>最近距离（m）
          <input id="minDepth" type="number" min="0" max="99" step="0.05" value="0.1">
        </label>
        <label>最远距离（m）
          <input id="maxDepth" type="number" min="0.01" max="100" step="0.1" value="5">
        </label>
      </div>
      <label>点大小
        <input id="pointSize" type="range" min="1" max="8" step="0.5" value="2">
      </label>
      <label class="check">
        <input id="semantic" type="checkbox">
        YOLO 语义着色（需启动时配置模型）
      </label>
      <label>柜面 RANSAC 阈值（mm）
        <input id="planeThreshold" type="number" min="1" max="50" step="1" value="8">
      </label>
      <label>WASDQE 微调步长（mm）
        <input id="nudgeStep" type="number" min="0.1" max="100" step="0.1" value="1">
      </label>
      <button id="loadBtn">加载点云</button>
      <button id="analyzeBtn" class="secondary">分析 YOLO 与柜面</button>
      <button id="pickBtn" class="secondary">点选三维目标</button>
      <button id="rgbPickBtn" class="secondary">在 RGB 图中选点</button>
      <button id="saveBtn" class="secondary" disabled>保存当前标注</button>
      <button id="refreshBtn" class="secondary">刷新拍摄目录</button>
      <button id="resetBtn" class="secondary">重置视角</button>
      <div id="analysis" class="analysis">尚未分析或点选</div>
      <div id="status" class="status"><strong>尚未加载</strong>选择会话与帧</div>
      <div class="hint">
        H/L 切换上一/下一帧。A/D 调 X，W/S 调 Y，Q/E 调 Z。左键拖动旋转，滚轮缩放。标注保存为会话目录下的 annotations.jsonl。
      </div>
    </aside>
    <section id="stage" class="stage">
      <canvas id="canvas"></canvas>
      <div id="hud" class="hud">0 points</div>
      <div id="targetMarker" class="target-marker"></div>
      <div id="rgbPicker" class="rgb-picker" hidden>
        <div class="rgb-head">
          <strong>RGB 选点</strong>
          <button id="closeRgbBtn" class="secondary">关闭</button>
        </div>
        <div id="rgbImageWrap" class="rgb-image-wrap">
          <img id="rgbImage" alt="当前帧 RGB">
          <div id="rgbOverlay" class="rgb-overlay"></div>
        </div>
        <div id="rgbFoot" class="rgb-foot">单击 RGB 像素，将由对齐深度换算成三维点。</div>
      </div>
    </section>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const canvas = $("canvas");
    const gl = canvas.getContext("webgl", {antialias: true, alpha: false});
    if (!gl) throw new Error("浏览器不支持 WebGL");

    const vertexSource = `
      attribute vec3 aPosition;
      attribute vec4 aColor;
      uniform vec3 uCenter;
      uniform float uYaw;
      uniform float uPitch;
      uniform float uDistance;
      uniform float uAspect;
      uniform float uPointSize;
      varying vec4 vColor;
      void main() {
        vec3 p = aPosition - uCenter;
        p.y = -p.y;
        p.z = -p.z;
        float cy = cos(uYaw), sy = sin(uYaw);
        float x1 = cy * p.x + sy * p.z;
        float z1 = -sy * p.x + cy * p.z;
        float cp = cos(uPitch), sp = sin(uPitch);
        float y2 = cp * p.y - sp * z1;
        float z2 = sp * p.y + cp * z1 - uDistance;
        float nearZ = 0.01, farZ = 100.0;
        float f = 1.7320508;
        gl_Position = vec4(
          f * x1 / uAspect,
          f * y2,
          ((farZ + nearZ) / (nearZ - farZ)) * z2 +
            (2.0 * farZ * nearZ / (nearZ - farZ)),
          -z2
        );
        gl_PointSize = uPointSize;
        vColor = aColor;
      }`;
    const fragmentSource = `
      precision mediump float;
      varying vec4 vColor;
      void main() {
        vec2 q = gl_PointCoord - vec2(0.5);
        if (dot(q, q) > 0.25) discard;
        gl_FragColor = vColor;
      }`;

    function shader(type, source) {
      const item = gl.createShader(type);
      gl.shaderSource(item, source);
      gl.compileShader(item);
      if (!gl.getShaderParameter(item, gl.COMPILE_STATUS))
        throw new Error(gl.getShaderInfoLog(item));
      return item;
    }
    const program = gl.createProgram();
    gl.attachShader(program, shader(gl.VERTEX_SHADER, vertexSource));
    gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fragmentSource));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS))
      throw new Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);
    const locations = {
      position: gl.getAttribLocation(program, "aPosition"),
      color: gl.getAttribLocation(program, "aColor"),
      center: gl.getUniformLocation(program, "uCenter"),
      yaw: gl.getUniformLocation(program, "uYaw"),
      pitch: gl.getUniformLocation(program, "uPitch"),
      distance: gl.getUniformLocation(program, "uDistance"),
      aspect: gl.getUniformLocation(program, "uAspect"),
      pointSize: gl.getUniformLocation(program, "uPointSize"),
    };
    const buffer = gl.createBuffer();
    let pointCount = 0;
    let cloudView = null;
    let center = [0, 0, 0], radius = 1;
    let yaw = 0, pitch = 0, distance = 2;
    let selectedTarget = null, currentAnalysis = null, pickMode = false;
    let selectedPixel = null, selectionSource = "pointcloud";
    let targetAdjustment = [0, 0, 0];

    function resetView() {
      yaw = 0; pitch = 0; distance = Math.max(radius * 2.2, 0.3);
    }

    function resize() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.max(1, Math.round(canvas.clientWidth * ratio));
      const height = Math.max(1, Math.round(canvas.clientHeight * ratio));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width; canvas.height = height;
      }
      gl.viewport(0, 0, width, height);
    }

    function render() {
      resize();
      gl.clearColor(0.015, 0.022, 0.035, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.enable(gl.DEPTH_TEST);
      if (pointCount) {
        gl.useProgram(program);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.enableVertexAttribArray(locations.position);
        gl.vertexAttribPointer(locations.position, 3, gl.FLOAT, false, 16, 0);
        gl.enableVertexAttribArray(locations.color);
        gl.vertexAttribPointer(locations.color, 4, gl.UNSIGNED_BYTE, true, 16, 12);
        gl.uniform3fv(locations.center, center);
        gl.uniform1f(locations.yaw, yaw);
        gl.uniform1f(locations.pitch, pitch);
        gl.uniform1f(locations.distance, distance);
        gl.uniform1f(locations.aspect, canvas.width / canvas.height);
        gl.uniform1f(locations.pointSize, Number($("pointSize").value));
        gl.drawArrays(gl.POINTS, 0, pointCount);
      }
      updateTargetMarker();
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    async function json(url, options = {}) {
      const response = await fetch(url, {cache: "no-store", ...options});
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
      return data;
    }

    async function refreshSessions(keepSelection = true) {
      const previous = keepSelection ? $("session").value : "";
      const status = await json("/api/status");
      $("rootPath").textContent = status.data_root;
      $("semantic").disabled = !status.yolo.enabled;
      $("semantic").title = status.yolo.enabled
        ? `模型：${status.yolo.model_path}`
        : "启动 run-pointcloud.sh 时传入 --model 才能启用";
      const data = await json("/api/sessions");
      $("session").innerHTML = (data.sessions || []).map(item =>
        `<option value="${escapeHtml(item.id)}">${escapeHtml(item.name)} · ${item.frame_count} 帧</option>`
      ).join("");
      if (previous && [...$("session").options].some(o => o.value === previous))
        $("session").value = previous;
      await refreshFrames();
    }

    async function refreshFrames() {
      const session = $("session").value;
      if (!session) {
        $("frame").innerHTML = "";
        setStatus("没有可用拍摄会话");
        return;
      }
      const data = await json(`/api/sessions/${encodeURIComponent(session)}/frames`);
      $("frame").innerHTML = (data.frames || []).map(item =>
        `<option value="${escapeHtml(item.id)}">#${item.sequence} · ${escapeHtml(item.saved_at || "")} · 有效 ${((item.valid_ratio || 0) * 100).toFixed(1)}%</option>`
      ).join("");
      if ($("frame").options.length) $("frame").selectedIndex = $("frame").options.length - 1;
    }

    async function loadCloud() {
      const session = $("session").value, frame = $("frame").value;
      if (!session || !frame) return setStatus("请先选择会话和帧", true);
      setStatus("点云重建中…");
      const query = new URLSearchParams({
        stride: $("stride").value,
        min_depth_m: $("minDepth").value,
        max_depth_m: $("maxDepth").value,
        max_points: $("maxPoints").value,
        semantic: $("semantic").checked ? "true" : "false",
      });
      const response = await fetch(
        `/api/pointcloud/${encodeURIComponent(session)}/${encodeURIComponent(frame)}?${query}`
      );
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.detail || `HTTP ${response.status}`);
      }
      const payload = await response.arrayBuffer();
      const view = new DataView(payload);
      const magic = String.fromCharCode(...new Uint8Array(payload, 0, 4));
      if (magic !== "PCD1") throw new Error("点云二进制格式错误");
      pointCount = view.getUint32(4, true);
      if (payload.byteLength !== 8 + pointCount * 16)
        throw new Error("点云数据长度不完整");
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Uint8Array(payload, 8), gl.STATIC_DRAW);
      cloudView = view;
      center = (response.headers.get("X-Cloud-Center") || "0,0,0").split(",").map(Number);
      radius = Number(response.headers.get("X-Cloud-Radius")) || 1;
      resetView();
      $("hud").textContent = `${pointCount.toLocaleString()} points · stride ${response.headers.get("X-Cloud-Stride")}`;
      setStatus(`${pointCount.toLocaleString()} 个点`, false,
        `${session}<br>${frame}<br>包围半径 ${radius.toFixed(3)} m`);
      selectedTarget = null;
      selectedPixel = null;
      selectionSource = "pointcloud";
      targetAdjustment = [0, 0, 0];
      currentAnalysis = null;
      setPickMode(false);
      await loadSavedAnnotation();
      if (!$("rgbPicker").hidden) await loadRgbImage();
    }

    function analysisOptions() {
      return {
        plane_threshold_m: Number($("planeThreshold").value) / 1000,
        min_depth_m: Number($("minDepth").value),
        max_depth_m: Number($("maxDepth").value),
      };
    }

    async function analyzeCurrent() {
      const session = $("session").value, frame = $("frame").value;
      if (!session || !frame) throw new Error("请先选择会话和帧");
      setStatus("正在执行 YOLO 与柜面拟合…");
      const data = await json(
        `/api/analyze/${encodeURIComponent(session)}/${encodeURIComponent(frame)}`,
        {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(analysisOptions()),
        }
      );
      currentAnalysis = data.analysis;
      updateAnalysisPanel();
      renderRgbOverlay();
      setStatus("分析完成", false,
        `柜面内点 ${(currentAnalysis.plane.inlier_ratio * 100).toFixed(1)}% · ` +
        `YOLO ${currentAnalysis.yolo.boxes.length} 个框`);
    }

    async function saveCurrentAnnotation() {
      const session = $("session").value, frame = $("frame").value;
      if (!selectedTarget) throw new Error("请先点选三维目标");
      setStatus("正在保存并复核柜面…");
      const data = await json(
        `/api/annotations/${encodeURIComponent(session)}/${encodeURIComponent(frame)}`,
        {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            ...analysisOptions(),
            target_camera_m: selectedTarget,
            target_pixel: selectedPixel,
            selection_source: selectionSource,
            target_adjustment_camera_m: targetAdjustment,
          }),
        }
      );
      currentAnalysis = {
        plane: data.annotation.plane,
        yolo: data.annotation.yolo,
      };
      selectedTarget = data.annotation.target_camera_m;
      selectedPixel = data.annotation.target_pixel || selectedPixel;
      selectionSource = data.annotation.selection_source || selectionSource;
      targetAdjustment =
        data.annotation.target_adjustment_camera_m || targetAdjustment;
      updateAnalysisPanel(
        data.annotation.target_plane_coordinates_m,
        true,
        data.annotation.target_relative_to_semantic_m
      );
      setStatus("标注已保存", false, "annotations.jsonl");
    }

    async function loadSavedAnnotation() {
      const session = $("session").value, frame = $("frame").value;
      if (!session || !frame) return;
      const data = await json(
        `/api/sessions/${encodeURIComponent(session)}/annotations`
      );
      const saved = (data.annotations || []).find(item => item.frame_id === frame);
      if (saved) {
        selectedTarget = saved.target_camera_m;
        selectedPixel = saved.target_pixel || null;
        selectionSource = saved.selection_source || "pointcloud";
        targetAdjustment =
          saved.target_adjustment_camera_m || [0, 0, 0];
        currentAnalysis = {plane: saved.plane, yolo: saved.yolo};
        updateAnalysisPanel(
          saved.target_plane_coordinates_m,
          true,
          saved.target_relative_to_semantic_m
        );
      } else {
        updateAnalysisPanel();
      }
      renderRgbOverlay();
    }

    function updateAnalysisPanel(local = null, saved = false, semanticLocal = null) {
      $("saveBtn").disabled = !selectedTarget;
      const lines = [];
      if (selectedTarget) {
        lines.push(`目标相机系 m: ${selectedTarget.map(v => v.toFixed(4)).join(", ")}`);
        lines.push(`选点来源: ${selectionSource === "rgb" ? "RGB 像素" : "三维点云"}`);
      }
      if (selectedPixel)
        lines.push(`RGB 像素: (${selectedPixel.u}, ${selectedPixel.v})`);
      if (targetAdjustment.some(value => Math.abs(value) > 1e-9))
        lines.push(`累计微调 mm: dX ${(targetAdjustment[0] * 1000).toFixed(1)}, dY ${(targetAdjustment[1] * 1000).toFixed(1)}, dZ ${(targetAdjustment[2] * 1000).toFixed(1)}`);
      if (currentAnalysis?.plane) {
        const p = currentAnalysis.plane;
        lines.push(`柜面法向: ${p.normal_camera.map(v => v.toFixed(4)).join(", ")}`);
        lines.push(`内点: ${(p.inlier_ratio * 100).toFixed(1)}%  RMS: ${(p.rms_m * 1000).toFixed(2)} mm`);
      }
      if (currentAnalysis?.yolo)
        lines.push(`YOLO 框: ${currentAnalysis.yolo.boxes.length}`);
      if (local)
        lines.push(`柜面坐标 mm: H ${(local.horizontal_m * 1000).toFixed(1)}, V ${(local.vertical_m * 1000).toFixed(1)}, N ${(local.normal_m * 1000).toFixed(1)}`);
      if (semanticLocal)
        lines.push(`相对语义簇 mm: dH ${(semanticLocal.horizontal_m * 1000).toFixed(1)}, dV ${(semanticLocal.vertical_m * 1000).toFixed(1)}, dN ${(semanticLocal.normal_m * 1000).toFixed(1)}`);
      if (saved) lines.push("状态: 已保存");
      $("analysis").textContent = lines.length ? lines.join("\n") : "尚未分析或点选";
    }

    function setPickMode(active) {
      pickMode = active;
      $("pickBtn").className = active ? "secondary pick-active" : "secondary";
      $("pickBtn").textContent = active ? "请在点云中单击目标…" : "点选三维目标";
      canvas.style.cursor = active ? "crosshair" : "grab";
    }

    async function openRgbPicker() {
      if (!$("session").value || !$("frame").value)
        throw new Error("请先选择会话和帧");
      $("rgbPicker").hidden = false;
      $("stage").classList.add("rgb-open");
      await loadRgbImage();
    }

    async function loadRgbImage() {
      const session = $("session").value, frame = $("frame").value;
      if (!session || !frame) return;
      const image = $("rgbImage");
      const loaded = new Promise((resolve, reject) => {
        image.onload = resolve;
        image.onerror = () => reject(new Error("RGB 图加载失败"));
      });
      image.src = `/api/rgb/${encodeURIComponent(session)}/${encodeURIComponent(frame)}?t=${Date.now()}`;
      await loaded;
      renderRgbOverlay();
      $("rgbFoot").textContent =
        `${image.naturalWidth}×${image.naturalHeight} · 单击像素选择对应三维点`;
    }

    function renderRgbOverlay() {
      const overlay = $("rgbOverlay");
      const image = $("rgbImage");
      overlay.replaceChildren();
      if (!image.naturalWidth || !image.naturalHeight) return;
      for (const box of currentAnalysis?.yolo?.boxes || []) {
        const [x1, y1, x2, y2] = box.xyxy;
        const element = document.createElement("div");
        element.className = "rgb-box";
        element.style.left = `${x1 / image.naturalWidth * 100}%`;
        element.style.top = `${y1 / image.naturalHeight * 100}%`;
        element.style.width = `${(x2 - x1) / image.naturalWidth * 100}%`;
        element.style.height = `${(y2 - y1) / image.naturalHeight * 100}%`;
        const label = document.createElement("span");
        label.textContent = `${box.name} ${(box.conf * 100).toFixed(0)}%`;
        element.appendChild(label);
        overlay.appendChild(element);
      }
      if (selectedPixel) {
        const dot = document.createElement("div");
        dot.className = "rgb-dot";
        dot.style.left = `${selectedPixel.u / image.naturalWidth * 100}%`;
        dot.style.top = `${selectedPixel.v / image.naturalHeight * 100}%`;
        overlay.appendChild(dot);
      }
    }

    async function selectRgbPixel(event) {
      const image = $("rgbImage");
      const rect = image.getBoundingClientRect();
      const u = Math.max(0, Math.min(
        image.naturalWidth - 1,
        Math.round((event.clientX - rect.left) / rect.width * image.naturalWidth)
      ));
      const v = Math.max(0, Math.min(
        image.naturalHeight - 1,
        Math.round((event.clientY - rect.top) / rect.height * image.naturalHeight)
      ));
      const session = $("session").value, frame = $("frame").value;
      $("rgbFoot").textContent = `正在读取像素 (${u}, ${v}) 的对齐深度…`;
      const data = await json(
        `/api/pixel-to-point/${encodeURIComponent(session)}/${encodeURIComponent(frame)}`,
        {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            u, v, search_radius: 6,
            min_depth_m: Number($("minDepth").value),
            max_depth_m: Number($("maxDepth").value),
          }),
        }
      );
      selectedTarget = data.point_camera_m;
      selectedPixel = data.used_pixel;
      selectionSource = "rgb";
      targetAdjustment = [0, 0, 0];
      setPickMode(false);
      updateAnalysisPanel();
      renderRgbOverlay();
      const shifted = data.search_distance_px > 0
        ? `，邻近有效像素 (${data.used_pixel.u}, ${data.used_pixel.v})`
        : "";
      $("rgbFoot").textContent =
        `深度 ${(data.depth_m * 1000).toFixed(1)} mm${shifted}`;
      setStatus("已从 RGB 选择三维目标", false,
        data.point_camera_m.map(value => value.toFixed(4)).join(", ") + " m");
    }

    function projectPosition(point) {
      let x = point[0] - center[0];
      let y = -(point[1] - center[1]);
      let z = -(point[2] - center[2]);
      const cy = Math.cos(yaw), sy = Math.sin(yaw);
      const x1 = cy * x + sy * z;
      const z1 = -sy * x + cy * z;
      const cp = Math.cos(pitch), sp = Math.sin(pitch);
      const y2 = cp * y - sp * z1;
      const z2 = sp * y + cp * z1 - distance;
      if (z2 >= -0.01) return null;
      const f = 1.7320508;
      const ndcX = (f * x1 / (canvas.width / canvas.height)) / -z2;
      const ndcY = (f * y2) / -z2;
      if (Math.abs(ndcX) > 1.05 || Math.abs(ndcY) > 1.05) return null;
      return [
        (ndcX * 0.5 + 0.5) * canvas.clientWidth,
        (1 - (ndcY * 0.5 + 0.5)) * canvas.clientHeight,
        -z2,
      ];
    }

    function pickTargetAt(clientX, clientY) {
      if (!cloudView || !pointCount) throw new Error("请先加载点云");
      const rect = canvas.getBoundingClientRect();
      const clickX = clientX - rect.left, clickY = clientY - rect.top;
      let best = null, bestDistance2 = 14 * 14, bestDepth = Infinity;
      for (let i = 0; i < pointCount; i++) {
        const offset = 8 + i * 16;
        const point = [
          cloudView.getFloat32(offset, true),
          cloudView.getFloat32(offset + 4, true),
          cloudView.getFloat32(offset + 8, true),
        ];
        const screen = projectPosition(point);
        if (!screen) continue;
        const dx = screen[0] - clickX, dy = screen[1] - clickY;
        const d2 = dx * dx + dy * dy;
        if (d2 < bestDistance2 || (d2 === bestDistance2 && screen[2] < bestDepth)) {
          bestDistance2 = d2;
          bestDepth = screen[2];
          best = point;
        }
      }
      if (!best) throw new Error("点击位置附近没有点，请增大点大小或调整视角");
      selectedTarget = best;
      selectedPixel = null;
      selectionSource = "pointcloud";
      targetAdjustment = [0, 0, 0];
      updateAnalysisPanel();
      renderRgbOverlay();
      setPickMode(false);
      setStatus("已点选三维目标", false, best.map(v => v.toFixed(4)).join(", ") + " m");
    }

    function updateTargetMarker() {
      const marker = $("targetMarker");
      if (!selectedTarget) {
        marker.style.display = "none";
        return;
      }
      const position = projectPosition(selectedTarget);
      if (!position) {
        marker.style.display = "none";
        return;
      }
      marker.style.display = "block";
      marker.style.left = `${position[0]}px`;
      marker.style.top = `${position[1]}px`;
    }

    function nudgeTarget(code) {
      const commands = {
        KeyA: [0, -1], KeyD: [0, 1],
        KeyW: [1, -1], KeyS: [1, 1],
        KeyQ: [2, -1], KeyE: [2, 1],
      };
      const command = commands[code];
      if (!command) return false;
      if (!selectedTarget) {
        setStatus("请先选择三维目标", true);
        return true;
      }
      const step = Number($("nudgeStep").value) / 1000;
      if (!Number.isFinite(step) || step <= 0) {
        setStatus("微调步长必须大于零", true);
        return true;
      }
      const [axis, direction] = command;
      const next = [...selectedTarget];
      next[axis] += direction * step;
      if (next[2] <= 0) {
        setStatus("Z 坐标必须大于零", true);
        return true;
      }
      selectedTarget = next;
      targetAdjustment[axis] += direction * step;
      updateAnalysisPanel();
      setStatus(
        `已微调 ${["X", "Y", "Z"][axis]} ${direction > 0 ? "+" : "−"}${(step * 1000).toFixed(1)} mm`,
        false,
        selectedTarget.map(value => value.toFixed(4)).join(", ") + " m"
      );
      return true;
    }

    function setStatus(title, error = false, detail = "") {
      $("status").className = "status" + (error ? " error" : "");
      $("status").innerHTML = `<strong>${title}</strong>${detail}`;
    }
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    $("session").onchange = () => refreshFrames()
      .then(() => $("frame").value && loadCloud())
      .catch(e => setStatus(e.message, true));
    $("frame").onchange = () => loadCloud().catch(e => setStatus(e.message, true));
    $("loadBtn").onclick = () => loadCloud().catch(e => setStatus(e.message, true));
    $("semantic").onchange = () => loadCloud().catch(e => setStatus(e.message, true));
    $("analyzeBtn").onclick = () => analyzeCurrent().catch(e => setStatus(e.message, true));
    $("pickBtn").onclick = () => setPickMode(!pickMode);
    $("rgbPickBtn").onclick = () => openRgbPicker().catch(e => setStatus(e.message, true));
    $("closeRgbBtn").onclick = () => {
      $("rgbPicker").hidden = true;
      $("stage").classList.remove("rgb-open");
    };
    $("rgbImage").onclick = event =>
      selectRgbPixel(event).catch(error => {
        $("rgbFoot").textContent = error.message;
        setStatus(error.message, true);
      });
    $("saveBtn").onclick = () => saveCurrentAnnotation().catch(e => setStatus(e.message, true));
    $("refreshBtn").onclick = () => refreshSessions().catch(e => setStatus(e.message, true));
    $("resetBtn").onclick = resetView;
    document.addEventListener("keydown", event => {
      if (event.ctrlKey || event.metaKey || event.altKey) return;
      const target = event.target;
      if (target instanceof HTMLElement &&
          (target.matches("input, textarea") || target.isContentEditable)) return;
      if (nudgeTarget(event.code)) {
        event.preventDefault();
        return;
      }
      if (event.repeat) return;

      const direction = event.code === "KeyH" ? -1 :
        event.code === "KeyL" ? 1 : 0;
      if (!direction) return;

      const frames = $("frame");
      const next = Math.max(
        0,
        Math.min(frames.options.length - 1, frames.selectedIndex + direction)
      );
      if (next === frames.selectedIndex) return;
      event.preventDefault();
      frames.selectedIndex = next;
      frames.dispatchEvent(new Event("change"));
    });
    canvas.ondblclick = () => { if (!pickMode) resetView(); };
    let dragging = false, lastX = 0, lastY = 0, downX = 0, downY = 0;
    canvas.onpointerdown = event => {
      dragging = !pickMode;
      lastX = downX = event.clientX;
      lastY = downY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
    };
    canvas.onpointerup = event => {
      dragging = false;
      if (pickMode && Math.hypot(event.clientX - downX, event.clientY - downY) < 5) {
        try { pickTargetAt(event.clientX, event.clientY); }
        catch (error) { setStatus(error.message, true); }
      }
    };
    canvas.onpointermove = event => {
      if (!dragging) return;
      yaw += (event.clientX - lastX) * 0.008;
      pitch = Math.max(-1.5, Math.min(1.5, pitch + (event.clientY - lastY) * 0.008));
      lastX = event.clientX; lastY = event.clientY;
    };
    canvas.onwheel = event => {
      event.preventDefault();
      distance = Math.max(0.02, distance * Math.exp(event.deltaY * 0.001));
    };
    window.onresize = resize;

    refreshSessions(false)
      .then(() => $("frame").value && loadCloud())
      .catch(error => setStatus(error.message, true));
  </script>
</body>
</html>
